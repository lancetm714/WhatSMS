services:
  whatsms:
    image: ghcr.io/lancetm714/whatsms:latest
    container_name: whatsms
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TEXBEE_API_KEY=${TEXBEE_API_KEY:-}
      - TEXBEE_DEVICE_ID=${TEXBEE_DEVICE_ID:-}
      - TEXBEE_BASE_URL=${TEXBEE_BASE_URL:-https://api.textbee.dev}
      - DEFAULT_DESTINATION=${DEFAULT_DESTINATION:-}
      - SMS_COUNTRY_CODE=${SMS_COUNTRY_CODE:-1}
      - SMS_MAX_ATTEMPTS=${SMS_MAX_ATTEMPTS:-10}
      - SMS_RETRY_BASE_MS=${SMS_RETRY_BASE_MS:-5000}
      - SMS_RETRY_MAX_MS=${SMS_RETRY_MAX_MS:-1800000}
      - SMS_SEND_DELAY_MS=${SMS_SEND_DELAY_MS:-2000}
      - SMS_WORKER_INTERVAL_MS=${SMS_WORKER_INTERVAL_MS:-5000}
      - SMS_POLL_INTERVAL_MS=${SMS_POLL_INTERVAL_MS:-15000}
      - SMS_DELIVERY_FIRST_CHECK_MS=${SMS_DELIVERY_FIRST_CHECK_MS:-3000}
      - PORT=3000
      - DATA_DIR=/app/data
